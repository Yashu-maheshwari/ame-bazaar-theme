name: Deploy Theme to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy WordPress Theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Setting up SSH directory..."
          mkdir -p ~/.ssh
          
          # Write SSH key using printf (secret corrected run)
          printf "%b\n" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "SSH setup completed."

      - name: Verify Remote Connection and Path
        run: |
          echo "Checking remote SSH connection and creating theme directory if missing..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "mkdir -p domains/amebazaar.in/public_html/wp-content/themes/ame-bazaar/"
          echo "Verification complete: Remote path verified/created."

      - name: Deploy Theme Files via Rsync
        run: |
          echo "Starting rsync transfer..."
          rsync --archive --compress --delete --verbose \
            -e "ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            wordpress/wp-content/themes/ame-bazaar/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:domains/amebazaar.in/public_html/wp-content/themes/ame-bazaar/
          echo "Deployment successful!"

      - name: Flush Remote OPCache
        run: |
          echo "Copying OPCache flusher to web root..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "cp domains/amebazaar.in/public_html/wp-content/themes/ame-bazaar/clear-cache.php domains/amebazaar.in/public_html/clear-cache.php"
          
          echo "Triggering OPCache flush..."
          curl -X POST -sL "https://amebazaar.in/clear-cache.php?token=7fa2e10db708b8b9487c69ea230768b6"
          
          echo "Removing OPCache flusher from web root..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "rm domains/amebazaar.in/public_html/clear-cache.php"

      - name: Warm Cache for Key Pages
        run: |
          echo "Warming cache for critical pages..."
          curl -s -o /dev/null -w "Homepage: %{http_code}\n" https://amebazaar.in/
          curl -s -o /dev/null -w "Contact Page: %{http_code}\n" https://amebazaar.in/contact/
          curl -s -o /dev/null -w "Tailoring Page: %{http_code}\n" https://amebazaar.in/tailoring-near-me/
          curl -s -o /dev/null -w "Mens Category: %{http_code}\n" https://amebazaar.in/product-category/mens-wear/
          curl -s -o /dev/null -w "Womens Category: %{http_code}\n" https://amebazaar.in/product-category/womens-wear/

      - name: Verify Deployed Files on Hostinger
        run: |
          echo "Listing domains contents..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "ls -la domains"
          
          echo "Listing domains/amebazaar.in contents..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "ls -la domains/amebazaar.in"
          
          echo "Listing domains/amebazaar.in/public_html contents..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "ls -la domains/amebazaar.in/public_html"
          
          echo "Listing public_html contents..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "ls -la public_html"
          
          echo "Listing remote theme files..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "ls -la domains/amebazaar.in/public_html/wp-content/themes/ame-bazaar/"
          
          echo "Checking functions.php content..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "cat domains/amebazaar.in/public_html/wp-content/themes/ame-bazaar/functions.php"
          
          echo "Checking if style.css exists..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "test -f domains/amebazaar.in/public_html/wp-content/themes/ame-bazaar/style.css"
          echo "style.css exists."
          
          echo "Checking if functions.php exists..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} "test -f domains/amebazaar.in/public_html/wp-content/themes/ame-bazaar/functions.php"
          echo "functions.php exists."
          
          echo "Verification successful: theme files deployed correctly!"

  qa-audit:
    name: Run Automated QA Checks
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm init -y
          npm install playwright axios
          npx playwright install --with-deps chromium

      - name: Run Playwright & Lighthouse QA checks
        run: node scripts/run-qa.js

      - name: Upload QA Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa/screenshots/

      - name: Upload Lighthouse Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-lighthouse
          path: qa/lighthouse/

      - name: Upload QA Final HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa/report.html

